name: Build and transfer FE to NAS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nas-fe
  cancel-in-progress: false

jobs:
  build-and-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NAS_PATH: /volume1/docker/gwiteem/product/fe
      ARCHIVE: gwiteem-fe.tar.gz
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Package standalone build
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          find .next/standalone -type f -name '.env*' -delete
          tar -czf "$ARCHIVE" -C .next/standalone .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Transfer archive over SSH and verify checksum
        env:
          NAS_SSH_PRIVATE_KEY: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          NAS_KNOWN_HOSTS: ${{ secrets.NAS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${NAS_SSH_PRIVATE_KEY:?Set NAS_SSH_PRIVATE_KEY repository secret}"
          : "${NAS_KNOWN_HOSTS:?Set NAS_KNOWN_HOSTS repository secret}"
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$NAS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$NAS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="hodo_admin@kimjihodo.synology.me"
          release="$NAS_PATH/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -p 22 "${ssh_options[@]}" "$target" "umask 077; mkdir -p '$release'"
          scp -O -P 22 "${ssh_options[@]}" "$ARCHIVE" "$ARCHIVE.sha256" "$target:$release/"
          ssh -p 22 "${ssh_options[@]}" "$target" "cd '$release' && sha256sum -c '$ARCHIVE.sha256' && touch TRANSFER_COMPLETE"
          printf 'Transferred and verified: %s:%s/%s\n' "$target" "$release" "$ARCHIVE" >> "$GITHUB_STEP_SUMMARY"

