name: Build and transfer FE to NAS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nas-fe
  cancel-in-progress: false

jobs:
  build-and-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NAS_PATH: /volume1/docker/gwiteem/FE
      ARCHIVE: gwiteem-fe.tar.gz
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Package standalone build
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/nas-runtime"
          node scripts/package-nas-build.mjs "$runtime_dir"
          tar -czf "$ARCHIVE" -C "$runtime_dir" .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Transfer and unpack runtime files on NAS
        env:
          SSHPASS: ${{ secrets.NAS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SSHPASS:?Set NAS_SSH_PASSWORD repository secret}"
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          touch "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/known_hosts"
          # 실행별 첫 접속의 호스트 키를 자동 저장하고, 같은 실행 중 키 변경은 거부합니다.
          ssh_options=(-o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="hodo_admin@kimjihodo.synology.me"
          transfer_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release="$NAS_PATH/.transfers/$transfer_id"
          sshpass -e ssh -p 22 "${ssh_options[@]}" "$target" "umask 077; mkdir -p '$release'"
          sshpass -e scp -O -P 22 "${ssh_options[@]}" "$ARCHIVE" "$ARCHIVE.sha256" "$target:$release/"
          sshpass -e ssh -p 22 "${ssh_options[@]}" "$target" "sh -s -- '$NAS_PATH' '$transfer_id' '$ARCHIVE'" < scripts/install-nas-build.sh
          printf 'Runtime files ready: %s:%s (server not started)\n' "$target" "$NAS_PATH" >> "$GITHUB_STEP_SUMMARY"
          printf 'Archive and backup: %s:%s\n' "$target" "$release" >> "$GITHUB_STEP_SUMMARY"
